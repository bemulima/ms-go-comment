version: '3'

dotenv: ['.env']

tasks:
  fmt:
    desc: Format Go source
    cmds:
      - gofmt -w cmd internal test

  deps:
    desc: Download Go modules into the repository-local cache
    cmds:
      - XDG_CACHE_HOME=$PWD/.cache GOMODCACHE=$PWD/.cache/gomod go mod download all

  tidy:
    desc: Reconcile Go module metadata
    cmds:
      - XDG_CACHE_HOME=$PWD/.cache GOMODCACHE=$PWD/.cache/gomod go mod tidy

  run:
    desc: Run the service locally
    cmds:
      - go run ./cmd/ms-comment-service

  run:native:
    desc: Run Comment natively against shared PostgreSQL, NATS, and Filestorage
    cmds:
      - python3 scripts/native_config.py -- go run ./cmd/ms-comment-service

  test:
    desc: Run unit and integration tests with repository-local caches
    cmds:
      - XDG_CACHE_HOME=$PWD/.cache GOCACHE=$PWD/.cache/go-build GOMODCACHE=$PWD/.cache/gomod go test ./...

  lint:
    desc: Run the Go linter
    cmds:
      - $PWD/.cache/bin/golangci-lint run ./...

  validate-contracts:
    desc: Validate checked-in agent contracts
    cmds:
      - make validate-contracts

  migrate:
    desc: Apply ordered PostgreSQL migrations to the standalone Docker database
    cmds:
      - make migrate

  migrate:native:
    desc: Apply ordered PostgreSQL migrations to shared native PostgreSQL
    cmds:
      - python3 scripts/native_config.py -- scripts/native_migrate.sh

  up:
    desc: Start standalone dependencies, migrate, then start the service
    cmds:
      - docker compose up -d postgres nats
      - make migrate
      - docker compose up -d --build ms-comment-service

  down:
    desc: Stop the local stack while retaining persistent volumes
    cmds:
      - docker compose down
