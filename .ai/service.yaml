schema_version: 1
name: ms-go-comment
service_kind: backend_service
repository_role: service
repository:
    git_url: https://github.com/bemulima/ms-go-comment.git
    default_branch: main
purpose: >-
    Independent authenticated discussion service for arbitrary external resources.
    It owns spaces, threads, multi-level comments, attachment bindings, moderation
    state, realtime sequencing, WebSocket tickets, and outbox delivery. It does
    not own host resources, user profiles, or binary file bytes.
stack:
    - name: language
      value: go
      confidence: 1
      source_path: go.mod
      explanation: go.mod is the canonical module manifest.
    - name: framework
      value: chi
      confidence: 0.98
      source_path: go.mod
      explanation: The service declares github.com/go-chi/chi.
    - name: realtime_transport
      value: NATS JetStream and Gorilla WebSocket
      confidence: 0.98
      source_path: go.mod
      explanation: The service declares nats.go and gorilla/websocket for durable and browser realtime delivery.
    - name: container
      value: docker
      confidence: 0.95
      source_path: docker/Dockerfile
      explanation: A multi-stage Dockerfile builds the service.
    - name: orchestration
      value: docker_compose
      confidence: 0.98
      source_path: docker-compose.yml
      explanation: Compose defines the local service and PostgreSQL dependency.
capabilities:
    - name: http_route
      value: GET /healthz
      confidence: 0.98
      source_path: internal/adapters/http/router.go
      explanation: The bootstrap router exposes the process health contract.
    - name: planned_business_capability
      value: Multi-level authenticated resource discussions
      confidence: 0.95
      source_path: internal/domain/comment.go
      explanation: Domain placement and content rules implement the backend model independently of adapters.
    - name: persistence_contract
      value: PostgreSQL schema and clean repository ports
      confidence: 0.98
      source_path: db/migrations/001_init.up.sql
      explanation: Six service-owned tables and transport-neutral repository ports define persistence ownership.
    - name: authenticated_comment_rest
      value: Thread ensure/read and comment list/get/changes/create/update/delete
      confidence: 0.98
      source_path: internal/adapters/http/router.go
      explanation: Authenticated routes call transaction-scoped comment use cases backed by pgx repositories.
    - name: attachment_lifecycle
      value: Validated temporary image upload, activation, signed GET, and asynchronous deletion
      confidence: 0.98
      source_path: internal/usecase/comment/attachment_service.go
      explanation: Comment owns authorization and metadata while FileStorage owns bytes.
    - name: realtime_websocket
      value: Ticket-authenticated realtime WebSocket projection
      confidence: 0.98
      source_path: internal/adapters/websocket/handler.go
      explanation: Single-use tickets, sequence reconciliation, bounded local hub, and NATS fan-out implement the approved contract.
    - name: transactional_outbox_delivery
      value: Atomic PostgreSQL lease and JetStream publication with event ID deduplication
      confidence: 0.98
      source_path: internal/usecase/realtime/dispatcher.go
      explanation: The dispatcher claims without holding a network transaction and records publish or retry evidence.
relations:
    - name: depends_on
      value: postgres
      confidence: 0.95
      source_path: docker-compose.yml
      explanation: PostgreSQL stores service-owned domain state and outbox rows.
    - name: depends_on
      value: nats
      confidence: 0.9
      source_path: docs/realtime-delivery.md
      explanation: NATS JetStream carries durable lifecycle events and realtime fan-out.
    - name: depends_on
      value: ms-go-filestorage
      confidence: 0.9
      source_path: docs/attachment-lifecycle.md
      explanation: FileStorage owns attachment bytes while Comment owns authorization and binding metadata.
    - name: receives_identity_from
      value: ms-gateway
      confidence: 0.95
      source_path: docs/access-integration.md
      explanation: Gateway is the trusted HTTP identity boundary.
contracts:
    - .ai/contracts/database.yaml
    - .ai/contracts/http.yaml
    - .ai/contracts/websocket.yaml
    - .ai/contracts/events.yaml
instructions:
    - AGENTS.md
    - prompts/git-workflow.md
    - docs/domain-map.md
commands:
    - format
    - dependencies
    - tidy
    - install_lint
    - test
    - lint
    - validate_contracts
    - migrate_local
workflows:
    - .ai/workflows/implement-feature.yaml
    - .ai/workflows/change-contract.yaml
    - .ai/workflows/test.yaml
