schema_version: 1
name: ms-go-comment
service_kind: backend_service
repository_role: service
repository:
    git_url: https://github.com/bemulima/ms-go-comment.git
    default_branch: main
purpose: >-
    Independent authenticated discussion service for arbitrary external resources.
    It owns spaces, threads, multi-level comments, attachment bindings, moderation
    state, realtime sequencing, WebSocket tickets, and outbox delivery. It does
    not own host resources, user profiles, or binary file bytes.
release_contract_map: docs/agent-contract-map.md
stack:
    - name: language
      value: go
      confidence: 1
      source_path: go.mod
      explanation: go.mod is the canonical module manifest.
    - name: framework
      value: chi
      confidence: 0.98
      source_path: go.mod
      explanation: The service declares github.com/go-chi/chi.
    - name: realtime_transport
      value: NATS JetStream and Gorilla WebSocket
      confidence: 0.98
      source_path: go.mod
      explanation: The service declares nats.go and gorilla/websocket for durable and browser realtime delivery.
    - name: container
      value: docker
      confidence: 0.95
      source_path: docker/Dockerfile
      explanation: A multi-stage Dockerfile builds the service.
    - name: orchestration
      value: docker_compose
      confidence: 0.98
      source_path: docker-compose.yml
      explanation: Compose defines the local service and PostgreSQL dependency.
capabilities:
    - name: http_route
      value: GET /healthz
      confidence: 0.98
      source_path: internal/adapters/http/router.go
      explanation: The bootstrap router exposes the process health contract.
    - name: authenticated_discussion_tree
      value: Multi-level authenticated resource discussions
      confidence: 0.95
      source_path: internal/domain/comment.go
      explanation: Domain placement, policy, idempotency and optimistic locking implement the backend model independently of adapters.
    - name: persistence_contract
      value: PostgreSQL schema and clean repository ports
      confidence: 0.98
      source_path: db/migrations/001_init.up.sql
      explanation: Seven service-owned tables and transport-neutral repository ports define persistence ownership.
    - name: authenticated_comment_rest
      value: Thread ensure/read and comment list/get/changes/create/update/delete
      confidence: 0.98
      source_path: internal/adapters/http/router.go
      explanation: Authenticated routes call transaction-scoped comment use cases backed by pgx repositories.
    - name: admin_configuration_rest
      value: Space lifecycle and thread policy administration
      confidence: 0.98
      source_path: internal/adapters/http/handlers/admin.go
      explanation: ADMIN owns configuration writes while ADMIN and MODERATOR may inspect spaces and threads.
    - name: comment_moderation_rest
      value: Transactional hide and restore with redacted recovery state
      confidence: 0.98
      source_path: internal/usecase/admin/service.go
      explanation: ADMIN and MODERATOR may hide or restore comments; every transition is sequenced and emitted through the outbox.
    - name: attachment_lifecycle
      value: Validated temporary image upload, activation, signed GET, and asynchronous deletion
      confidence: 0.98
      source_path: internal/usecase/comment/attachment_service.go
      explanation: Comment owns authorization and metadata while FileStorage owns bytes.
    - name: realtime_websocket
      value: Ticket-authenticated realtime WebSocket projection
      confidence: 0.98
      source_path: internal/adapters/websocket/handler.go
      explanation: Single-use tickets, sequence reconciliation, bounded local hub, and NATS fan-out implement the approved contract.
    - name: transactional_outbox_delivery
      value: Atomic PostgreSQL lease and JetStream publication with event ID deduplication
      confidence: 0.98
      source_path: internal/usecase/realtime/dispatcher.go
      explanation: The dispatcher claims without holding a network transaction and records publish or retry evidence.
    - name: private_resource_access
      value: Internal thread resolution and short-lived browser access grants
      confidence: 0.98
      source_path: internal/usecase/access/service.go
      explanation: Trusted hosts mint hash-only grants bound to issuer, user, resource, permissions, and expiry; REST and realtime enforce the binding.
    - name: http_security_guardrails
      value: Bounded actor rate limiting, panic recovery, request IDs, security headers, and server timeouts
      confidence: 0.98
      source_path: internal/adapters/http/middleware/guardrails.go
      explanation: Per-instance protection is memory-bounded and complements gateway-level multi-instance controls.
    - name: headless_browser_sdk
      value: Typed REST, private grant, realtime ticket, reconnect, and sequence reconciliation client
      confidence: 0.98
      source_path: web/src/index.ts
      explanation: Framework-agnostic SDK centralizes browser transport without accepting identity headers or rendering untrusted content.
    - name: embeddable_comment_shell
      value: Explicitly registered safe realtime discussion tree and policy-aware composer for arbitrary host pages
      confidence: 0.98
      source_path: web/src/element.ts
      explanation: The component paginates roots/replies, creates comments, stages images, reconciles ticket-authenticated live events in place, and keeps private grants out of markup.
relations:
    - name: depends_on
      value: postgres
      confidence: 0.95
      source_path: docker-compose.yml
      explanation: PostgreSQL stores service-owned domain state and outbox rows.
    - name: depends_on
      value: nats
      confidence: 0.9
      source_path: docs/realtime-delivery.md
      explanation: NATS JetStream carries durable lifecycle events and realtime fan-out.
    - name: depends_on
      value: ms-go-filestorage
      confidence: 0.9
      source_path: docs/attachment-lifecycle.md
      explanation: FileStorage owns attachment bytes while Comment owns authorization and binding metadata.
    - name: receives_identity_from
      value: ms-gateway
      confidence: 0.95
      source_path: docs/access-integration.md
      explanation: Gateway is the trusted HTTP identity boundary.
contracts:
    - .ai/contracts/database.yaml
    - .ai/contracts/http.yaml
    - .ai/contracts/websocket.yaml
    - .ai/contracts/events.yaml
    - .ai/contracts/frontend.yaml
instructions:
    - AGENTS.md
    - prompts/git-workflow.md
    - docs/domain-map.md
    - docs/agent-contract-map.md
commands:
    - format
    - dependencies
    - tidy
    - install_lint
    - test
    - lint
    - validate_contracts
    - migrate_local
    - web_test
    - web_build
workflows:
    - .ai/workflows/implement-feature.yaml
    - .ai/workflows/change-contract.yaml
    - .ai/workflows/test.yaml
