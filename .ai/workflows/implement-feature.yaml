schema_version: 1
name: implement-feature
steps:
    - read .ai/service.yaml and linked instructions
    - confirm ownership, acceptance criteria, compatibility, and affected contracts
    - implement within the comment domain, use-case, and adapter boundaries
    - add focused tests for authorization, persisted state, and delivery effects
    - update owned docs and machine-readable contracts when behavior changes
    - run .ai/workflows/test.yaml
    - review the actual diff before delivery
