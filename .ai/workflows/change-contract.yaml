schema_version: 1
name: change-contract
steps:
    - identify the owning contract plus every producer and consumer
    - compare HTTP, WebSocket, event, database, FileStorage, gateway, and browser compatibility
    - plan migration, versioning, idempotency, and rollout behavior before implementation
    - update implementation, tests, repository-owned docs, and machine-readable contract evidence together
    - run repository verification
    - review the actual diff and explicitly report breaking or cross-repository follow-up work
