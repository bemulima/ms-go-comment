schema_version: 1
name: review
steps:
  - read the issue, contracts, migrations, and actual diff
  - inspect gateway, internal-token, grant, ticket, role, and resource authorization
  - inspect comment placement, idempotency, optimistic locking, moderation, attachment, and content-safety rules
  - inspect transaction, sequence, outbox, retry, deduplication, and reconciliation behavior
  - verify migration reversibility, producer-consumer compatibility, tests, and docs
  - report findings by severity with exact file and line
