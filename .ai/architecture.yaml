schema_version: 1
style: clean_architecture
entrypoints:
    - name: ms-comment-service
      source_path: cmd/ms-comment-service/main.go
      responsibilities:
        - process lifecycle
        - dependency composition
        - graceful shutdown
layers:
    - name: domain
      source_path: internal/domain
      responsibilities:
        - entities and value objects
        - invariants and stable errors
        - repository and publisher ports
      dependency_rule: imports no adapters
    - name: usecase
      source_path: internal/usecase
      responsibilities:
        - transaction-scoped business processes
        - authorization policy orchestration
        - sequence and outbox orchestration
      dependency_rule: depends on domain ports, not concrete adapters
    - name: http_api_transport
      source_path: internal/transport/http/api
      responsibilities:
        - authenticated user route registration
        - request decoding and response mapping
        - gateway identity extraction
      dependency_rule: handlers remain thin and call use cases
    - name: http_admin_transport
      source_path: internal/transport/http/admin
      responsibilities:
        - role-protected configuration and moderation route registration
      dependency_rule: handlers remain thin and call use cases
    - name: http_private_transport
      source_path: internal/transport/http/private
      responsibilities:
        - trusted service-to-service route registration
      dependency_rule: internal token validation remains at the transport boundary
    - name: websocket_transport
      source_path: internal/transport/websocket
      responsibilities:
        - ticket consumption
        - connection lifecycle
        - event projection and ephemeral messages
      dependency_rule: does not implement durable comment mutations
    - name: postgres_infrastructure
      source_path: internal/infrastructure/persistence/postgres
      responsibilities:
        - pgx repositories
        - transaction manager
        - outbox claiming
    - name: nats_infrastructure
      source_path: internal/infrastructure/messaging/nats
      responsibilities:
        - JetStream publication
        - lifecycle subscription
        - ephemeral thread fan-out
    - name: filestorage_infrastructure
      source_path: internal/infrastructure/filestorage
      responsibilities:
        - staged upload
        - idempotent activation and deletion
        - signed URL requests
    - name: browser_sdk
      source_path: web/src
      responsibilities:
        - typed REST transport
        - access-grant forwarding
        - realtime ticket handshake and reconciliation
        - safe recursive Web Component projection
        - policy-aware comment and attachment composer UX
        - opt-in in-place realtime and typing projection
      dependency_rule: owns no business authorization and never interprets comment content as HTML
domain_ownership:
    - CommentSpace
    - CommentThread
    - Comment
    - CommentAttachment
    - OutboxEvent
    - RealtimeTicket
    - AccessGrant
domain_sources:
    entities: internal/domain
    persistence_ports: internal/domain/repository
    initial_migration: db/migrations/001_init.up.sql
implemented_adapters:
    http: internal/transport/http
    postgres: internal/infrastructure/persistence/postgres
    filestorage: internal/infrastructure/filestorage
    nats: internal/infrastructure/messaging/nats
    websocket: internal/transport/websocket
    http_guardrails: internal/transport/http/middleware/guardrails.go
    browser_sdk: web/src
    web_component: web/src/element.ts
implemented_usecases:
    thread_and_comment: internal/usecase/comment/service.go
    attachment_lifecycle: internal/usecase/comment/attachment_service.go
    realtime_tickets: internal/usecase/realtime/ticket_service.go
    private_resource_access: internal/usecase/access/service.go
    outbox_dispatch: internal/usecase/realtime/dispatcher.go
external_ownership:
    - name: user_identity_and_profile
      owner: ms-go-auth/ms-go-user
      local_reference: author_id UUID without cross-database FK
    - name: host_resource
      owner: integrating service
      local_reference: exact opaque space/resource tuple
    - name: attachment_bytes
      owner: ms-go-filestorage
      local_reference: filestorage_id
runtime_modes:
    - all
    - api
    - realtime
    - worker
