schema_version: 1
status: implemented
source_of_truth: docs/websocket-contract.md
endpoint: GET /api/v1/ws
protocol: comment.v1
authentication:
    mechanism: short-lived single-use opaque ticket
    transport: Sec-WebSocket-Protocol ticket.<opaque>
    ticket_endpoint: POST /api/v1/realtime/ticket
    maximum_ttl_seconds: 30
    access_token_in_url: forbidden
    reconnect_context: requested last_sequence is stored with the ticket and returned on atomic consumption
    context_grant_header: X-Comment-Access-Grant is required only while minting a ticket for context_grant spaces
    context_grant_on_handshake: forbidden; the stored single-use ticket is authoritative
    permission_attenuation: grant permissions intersect current thread state and effective image policy
server_events:
    durable:
        - comment.created
        - comment.updated
        - comment.deleted
        - comment.hidden
        - comment.restored
        - attachment.ready
        - attachment.failed
        - thread.updated
    ephemeral:
        - connection.ready
        - typing.started
        - typing.stopped
        - resync_required
        - error
        - ping
client_events:
    - typing.start
    - typing.stop
    - pong
recovery:
    sequence_source: comment_thread.last_sequence
    rest_endpoint: GET /api/v1/comment/changes
implementation:
    handler: internal/adapters/websocket/handler.go
    hub: internal/adapters/websocket/hub.go
    ticket_usecase: internal/usecase/realtime/ticket_service.go
    ticket_repository: internal/adapters/postgres/realtime_ticket_repository.go
limits:
    default_max_frame_bytes: 16384
    default_connections_per_user: 5
    default_outbound_queue_frames: 64
origin:
    source: comment_space.allowed_origins
    matching: exact
