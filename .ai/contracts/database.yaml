    - up: db/migrations/001_init.up.sql
      down: db/migrations/001_init.down.sql
      issue: 3
    - up: db/migrations/002_attachment_delivery.up.sql
      down: db/migrations/002_attachment_delivery.down.sql
      issue: 5
    - up: db/migrations/003_access_grants.up.sql
      down: db/migrations/003_access_grants.down.sql
      issue: 20
owned_tables:
    - name: comment_space
      issue: 3
      domain_source: internal/domain/space.go
    - name: comment_thread
      issue: 3
      domain_source: internal/domain/thread.go
    - name: comment
      issue: 3
      domain_source: internal/domain/comment.go
    - name: comment_attachment
      issue: 3
      domain_source: internal/domain/attachment.go
      lifecycle_delivery_issue: 5
    - name: comment_outbox
      issue: 3
      domain_source: internal/domain/outbox.go
      delivery_issue: 6
      repository_source: internal/infrastructure/persistence/postgres/outbox_repository.go
    - name: comment_ws_ticket
      issue: 3
      domain_source: internal/domain/realtime_ticket.go
      lifecycle_issue: 6
      repository_source: internal/infrastructure/persistence/postgres/realtime_ticket_repository.go
    - name: comment_access_grant
      issue: 20
      domain_source: internal/domain/access_grant.go
      repository_source: internal/infrastructure/persistence/postgres/access_grant_repository.go
invariants:
    - one thread per exact space/resource tuple
    - reply parent and root belong to the same thread
    - comment placement is immutable
    - create idempotency key is unique per author
    - mutation sequence and outbox event commit atomically
    - attachment binding never crosses uploader or thread ownership
    - attachment activation and deletion retries are observable and idempotent
    - realtime ticket preserves the optional requested last_sequence until atomic handshake consumption
    - outbox claim commits a finite retry lease before any NATS network call
    - realtime ticket raw secret is never persisted and consume deletes it atomically
    - access grant raw secret is never persisted and resolves only for its bound user, space/resource tuple, permissions, and expiry
migration_policy:
    directory: db/migrations
    format: ordered reversible up/down pairs
    destructive_change_requires: .ai/workflows/change-contract.yaml
repository_ports: internal/domain/repository
