schema_version: 1
status: user_realtime_admin_and_internal_routes_implemented
source_of_truth: docs/http-contract.md
route_groups:
    - prefix: /api/v1
      status: implemented
      authentication: required gateway identity
      routes:
        - PUT /thread/ensure
        - GET /thread/get/{threadID}
        - GET /comment/list
        - GET /comment/get/{commentID}
        - GET /comment/changes
        - POST /comment/create
        - PUT /comment/update/{commentID}
        - DELETE /comment/delete/{commentID}
        - POST /comment-attachment/upload
        - GET /comment-attachment/signed-url/{attachmentID}
        - DELETE /comment-attachment/delete/{attachmentID}
        - POST /realtime/ticket
        - GET /ws
    - prefix: /admin/v1
      status: implemented
      authentication: ADMIN configuration writes; ADMIN or MODERATOR configuration reads and moderation
      routes:
        - POST /space/create
        - GET /space/get/{spaceID}
        - GET /space/list
        - PUT /space/update/{spaceID}
        - DELETE /space/delete/{spaceID}
        - GET /thread/list
        - PUT /thread/update/{threadID}
        - PUT /comment/hide/{commentID}
        - PUT /comment/restore/{commentID}
    - prefix: /internal/v1
      status: implemented
      authentication: exact configured X-Internal-Token on trusted service network
      routes:
        - POST /access-grant/create
        - POST /thread/ensure
        - GET /thread/get-by-resource
implemented_routes:
    - GET /healthz
    - PUT /api/v1/thread/ensure
    - GET /api/v1/thread/get/{threadID}
    - GET /api/v1/comment/list
    - GET /api/v1/comment/get/{commentID}
    - GET /api/v1/comment/changes
    - POST /api/v1/comment/create
    - PUT /api/v1/comment/update/{commentID}
    - DELETE /api/v1/comment/delete/{commentID}
    - POST /api/v1/comment-attachment/upload
    - GET /api/v1/comment-attachment/signed-url/{attachmentID}
    - DELETE /api/v1/comment-attachment/delete/{attachmentID}
    - POST /api/v1/realtime/ticket
    - GET /api/v1/ws
    - POST /admin/v1/space/create
    - GET /admin/v1/space/get/{spaceID}
    - GET /admin/v1/space/list
    - PUT /admin/v1/space/update/{spaceID}
    - DELETE /admin/v1/space/delete/{spaceID}
    - GET /admin/v1/thread/list
    - PUT /admin/v1/thread/update/{threadID}
    - PUT /admin/v1/comment/hide/{commentID}
    - PUT /admin/v1/comment/restore/{commentID}
    - POST /internal/v1/access-grant/create
    - POST /internal/v1/thread/ensure
    - GET /internal/v1/thread/get-by-resource
implementation:
    router: internal/transport/http/router.go
    api_router: internal/transport/http/api/router.go
    admin_router: internal/transport/http/admin/router.go
    handlers: internal/transport/http/handlers/comment.go
    usecase: internal/usecase/comment/service.go
    persistence: internal/infrastructure/persistence/postgres
    attachment_handler: internal/transport/http/handlers/attachment.go
    filestorage_adapter: internal/infrastructure/filestorage/client.go
    realtime_ticket_handler: internal/transport/http/handlers/realtime.go
    websocket_handler: internal/transport/websocket/handler.go
    admin_handler: internal/transport/http/handlers/admin.go
    admin_usecase: internal/usecase/admin/service.go
    internal_router: internal/transport/http/private/router.go
    internal_handler: internal/transport/http/handlers/internal.go
    access_usecase: internal/usecase/access/service.go
    access_repository: internal/infrastructure/persistence/postgres/access_grant_repository.go
authentication:
    headers:
        - X-User-ID as UUID
        - X-User-Role as non-empty non-GUEST role
    actor_fields_in_body: rejected
    websocket: single-use ticket in Sec-WebSocket-Protocol; gateway actor headers are not used
    private_resource_header: X-Comment-Access-Grant on authenticated REST and realtime ticket minting
    private_resource_binding: issuer + user_id + space/resource tuple + permissions + expiry
    internal_header: exact X-Internal-Token
guardrails:
    request_id: server-generated X-Request-ID replaces client input
    panic_contract: logged with request ID and returned as stable internal_error JSON
    security_headers:
        - 'Cache-Control: no-store'
        - 'Content-Security-Policy: default-src none; frame-ancestors none'
        - 'X-Content-Type-Options: nosniff'
        - 'X-Frame-Options: DENY'
    actor_rate_limit:
        scope: authenticated /api/v1 REST and realtime ticket; WebSocket upgrade excluded
        algorithm: bounded per-instance token bucket keyed by verified actor UUID
        defaults: 20 requests per second, burst 40, maximum 10000 actors, idle expiry 300 seconds
        exhaustion: 429 rate_limited with Retry-After 1
        multi_instance: gateway or distributed limiter remains authoritative
    server_limits:
        read_header_timeout_seconds: 5
        read_timeout_seconds: 30
        write_timeout_seconds: 75
        idle_timeout_seconds: 60
        max_header_bytes: 32768
pagination:
    default_limit: 20
    maximum_limit: 100
    comment_list_cursor: opaque base64url cursor scoped to thread_id and parent_id
    changes_cursor: after_sequence
    admin_lists: bounded limit and offset
error_contract: docs/error-contract.md
