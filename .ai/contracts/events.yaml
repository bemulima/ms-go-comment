schema_version: 1
status: implemented
source_of_truth: docs/realtime-delivery.md
delivery:
    durable_transport: NATS JetStream
    persistence_boundary: PostgreSQL transactional outbox
    semantics: at-least-once
    deduplication_key: event_id
subjects:
    - comment.created
    - comment.updated
    - comment.deleted
    - comment.hidden
    - comment.restored
    - comment.attachment.ready
    - comment.attachment.failed
    - comment.thread.updated
required_envelope_fields:
    - schema_version
    - event_id
    - occurred_at
    - thread_id
    - sequence
consumer_rules:
    - deduplicate by event_id
    - apply comment state by sequence and version
    - reconcile gaps through GET /api/v1/comment/changes
producer_source: internal/usecase/comment/service.go
outbox_repository: internal/adapters/postgres/outbox_repository.go
attachment_lifecycle_source: internal/usecase/comment/attachment_service.go
attachment_worker: cmd/ms-comment-service/main.go
dispatcher: internal/usecase/realtime/dispatcher.go
nats_publisher: internal/adapters/nats/client.go
nats_subscriber: internal/adapters/nats/subscriber.go
outbox_claim:
    strategy: atomic lease using next_attempt_at and FOR UPDATE SKIP LOCKED
    network_inside_transaction: false
    retry_backoff: 5 seconds exponential capped at 5 minutes
ephemeral:
    transport: Core NATS
    subject: comment.realtime.typing.<thread_uuid>
