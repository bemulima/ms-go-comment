schema_version: 1
status: frontend_v1_runtime_and_integration_contract_implemented
source_of_truth: web/README.md
package: '@bemulima/ms-comment-client'
location: web
boundaries:
    identity: gateway session through credentials include; SDK never sets X-User-ID or X-User-Role
    private_access: optional X-Comment-Access-Grant provider
    internal_token: forbidden
    html_rendering: outside headless SDK; raw HTML is never rendered
    policy_authority: browser guidance is advisory; backend effective policy and authorization are authoritative
rest:
    source: web/src/client.ts
    base_path_default: /api/comment/v1
    capabilities:
        - thread ensure/get
        - comment list/get/changes/create/update/delete
        - attachment upload/signed-url/delete
        - realtime ticket mint
realtime:
    source: web/src/realtime.ts
    credential: ticket.<opaque> Sec-WebSocket-Protocol only
    ticket_in_url: forbidden
    recovery: sequence gaps and resync_required call REST changes until has_more is false
    reconnect: remints a single-use ticket
    states: connecting, connected, reconnecting, stopped
    application_liveness: ping receives pong without requiring thread_id
web_component:
    source: web/src/element.ts
    tag: ms-comment-thread
    registration: explicit through defineCommentThreadElement
    attributes:
        - base-url
        - space-key
        - resource-type
        - resource-id
        - heading
        - page-size
        - realtime
    private_access: accessGrant property only; forbidden in markup
    methods:
        - refresh
        - loadMore
        - loadReplies
    events:
        - ms-comment-ready
        - ms-comment-error
        - ms-comment-select
        - ms-comment-reply-start
        - ms-comment-replies-loaded
        - ms-comment-attachment-uploaded
        - ms-comment-created
        - ms-comment-realtime-state
        - ms-comment-reconciled
        - ms-comment-typing
        - ms-comment-thread-updated
    tree: roots and each direct-child branch own independent opaque cursor pagination
    composer: root and reply create with client UUID idempotency key; hidden unless thread is open
    ambiguous_create: network/5xx retains the exact payload and idempotency key for explicit retry; no attachment cleanup
    policy_ux: max depth/body/attachments/image bytes plus link and image flags come from effective thread policy
    attachments: JPEG/PNG/WebP stage before create, bind by ID, cleanup after explicit 4xx rejection, ready preview through signed URL
    rendering: bodies and filenames use textContent; only checked HTTP(S) links and signed image URLs become attributes
    accessibility: native button, form, label, details/summary and live-region semantics
    accessibility_details: labelled and described inputs, atomic live regions, alert load failures, visible focus, text tombstones
    theming: documented --ms-comment-* custom properties and stable shadow parts
    integration_guide: docs/frontend-integration.md
    vanilla_example: web/examples/vanilla.html
    realtime: explicit opt-in; lifecycle stop; in-place comment/policy reconciliation; typing; draft and branch preservation
    states: loading, empty, error, ready, root pagination, branch pagination, submitting, connecting, live, reconnecting
    deferred:
        - edit and delete controls
        - moderation and admin controls
tests:
    - web/test/client.test.mjs
    - web/test/element.test.mjs
