name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Agent policy
        run: ./scripts/check-agent-policy.sh
      - name: Formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Install linter
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Lint
        run: $(go env GOPATH)/bin/golangci-lint run ./...
      - name: Go test
        run: go test ./... -count=1
      - name: Go build
        run: go build -o /tmp/ms-go-comment ./cmd/ms-comment-service
      - name: Agent contracts
        run: make validate-contracts
      - name: Browser dependencies
        run: npm ci --prefix web
      - name: Browser test
        run: npm --prefix web test
      - name: Browser build
        run: npm --prefix web run build
