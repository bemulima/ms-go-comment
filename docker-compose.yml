services:
  postgres:
    container_name: ms-comment-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ms_comment}
    ports:
      - "${POSTGRES_PORT:-5443}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-ms_comment}"]
      interval: 2s
      timeout: 3s
      retries: 15

  ms-comment-service:
    container_name: ms-comment-service
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      HTTP_PORT: "8080"
      HTTP_READ_HEADER_TIMEOUT_SECONDS: "5"
      HTTP_READ_TIMEOUT_SECONDS: "30"
      HTTP_WRITE_TIMEOUT_SECONDS: "75"
      HTTP_IDLE_TIMEOUT_SECONDS: "60"
      HTTP_MAX_HEADER_BYTES: "32768"
      HTTP_USER_RATE_LIMIT_RPS: "20"
      HTTP_USER_RATE_LIMIT_BURST: "40"
      HTTP_USER_RATE_LIMIT_MAX_ACTORS: "10000"
      HTTP_USER_RATE_LIMIT_IDLE_SECONDS: "300"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ms_comment}?sslmode=disable
      NATS_URL: nats://nats:4222
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me}
      ACCESS_GRANT_MAX_TTL_SECONDS: "300"
      ACCESS_GRANT_CLEANUP_SECONDS: "60"
      FILESTORAGE_SERVICE_BASE_URL: http://ms-filestorage:8080
      SERVICE_MODE: all
      ATTACHMENT_TTL_MINUTES: "60"
      ATTACHMENT_SIGNED_URL_MINUTES: "5"
      ATTACHMENT_WORKER_INTERVAL_SECONDS: "5"
      ATTACHMENT_WORKER_BATCH: "50"
      ATTACHMENT_ACTIVATION_MAX_ATTEMPTS: "5"
      OUTBOX_WORKER_INTERVAL_MS: "500"
      OUTBOX_WORKER_BATCH: "100"
      OUTBOX_LEASE_SECONDS: "30"
      REALTIME_TICKET_TTL_SECONDS: "30"
      REALTIME_TICKET_CLEANUP_SECONDS: "30"
      WS_MAX_CONNECTIONS_PER_USER: "5"
      WS_QUEUE_SIZE: "64"
      WS_MAX_FRAME_BYTES: "16384"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${COMMENT_PORT:-8092}:8080"
    networks:
      - default
      - ms-net

volumes:
  pgdata:

networks:
  ms-net:
    external: true
